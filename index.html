<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>survay-test</title>
    <!-- فونت وزیرمتن از گوگل. برای هاست محلی: فایل فونت را در پوشه ../fonts بگذارید (fonts/README.txt) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- استایل پروژه (مسیر نسبی؛ در VS Code هم بدون مشکل کار می‌کند) -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- سه رادیوی مخفی: سوییچ بین خانه / نظرسنجی / درباره ما فقط با CSS -->
    <input type="radio" name="view" id="viewHero" class="view-radio" checked />
    <input type="radio" name="view" id="viewSurvey" class="view-radio" />
    <input type="radio" name="view" id="viewAbout" class="view-radio" />

    <nav class="topnav">
      <div class="logo right">
        <!-- لوگوی راست: فعلاً همان لوگوی svg؛ بعداً فایل دوم را اینجا بگذارید -->
        <img class="logo-img" src="/public/svg/adtory_logo-13.svg" alt="لوگو" />
      </div>
      <div class="nav-center">
        <label for="viewHero" class="home-btn" data-i18n="home"></label>
        <label for="viewAbout" class="home-btn" data-i18n="navAbout"></label>
        <div class="contact-wrap">
          <!-- آدرس اینستاگرام واقعی را جای your_page بگذارید -->
          <a
            href="https://instagram.com/your_page"
            target="_blank"
            rel="noopener"
            class="home-btn"
            data-i18n="navContact"
          ></a>
          <div class="ig-preview">Instagram · @xxxxxxxxxx</div>
        </div>
        <div class="lang-switch">
          <button data-lang="fa">فارسی</button
          ><button data-lang="en">English</button
          ><button data-lang="ar">العربية</button>
        </div>
      </div>
      <div class="logo left">
        <!-- لوگوی چپ: فعلاً همان لوگو؛ بعداً لوگوی دوم را اینجا بگذارید -->
        <img class="logo-img" src="../svg/logo.svg" alt="لوگو" />
      </div>
    </nav>

    <main>
      <!-- ============ صفحه اصلی ============ -->
      <section id="hero">
        <div class="hero-grid">
          <div class="hero-text">
            <h1 data-i18n="heroTitle"></h1>
            <p data-i18n="heroDesc"></p>
            <p class="hero-meta" data-i18n="heroMeta"></p>
          </div>
          <div class="hero-media">
            <!-- کلیک روی خود عکس، لایت‌باکس بزرگ را باز می‌کند. عکس‌ها: E19, E21, E16, E13, E14 -->
            <label for="lbToggle" class="slide-frame">
              <img
                class="hero-slide"
                src="../img/E19.jpg"
                alt="Truck front view at sunset"
              />
              <img
                class="hero-slide"
                src="../img/E21.jpg"
                alt="Truck at a night gas station"
              />
              <img
                class="hero-slide"
                src="../img/E16.jpg"
                alt="Truck on a curved road at sunset"
              />
              <img
                class="hero-slide"
                src="../img/E13.jpg"
                alt="Truck facing the sunset on gravel"
              />
              <img
                class="hero-slide"
                src="../img/E14.jpg"
                alt="Truck on a canyon cliff at dusk"
              />
              <span class="zoom-btn" data-i18n="zoom"></span>
            </label>
          </div>
        </div>
        <!-- دکمه شروع: وسط و پایین‌تر -->
        <div class="hero-cta-row">
          <label
            for="viewSurvey"
            id="startLabel"
            class="cta"
            data-i18n="heroCta"
          ></label>
        </div>
      </section>

      <!-- ============ نظرسنجی ۱۰ مرحله‌ای (عکس‌ها از پوشه img) ============ -->
      <section id="survey">
        <div class="survey-body">
          <input
            type="radio"
            name="step"
            id="step1"
            class="step-radio"
            checked
          />
          <input type="radio" name="step" id="step2" class="step-radio" />
          <input type="radio" name="step" id="step3" class="step-radio" />
          <input type="radio" name="step" id="step4" class="step-radio" />
          <input type="radio" name="step" id="step5" class="step-radio" />
          <input type="radio" name="step" id="step6" class="step-radio" />
          <input type="radio" name="step" id="step7" class="step-radio" />
          <input type="radio" name="step" id="step8" class="step-radio" />
          <input type="radio" name="step" id="step9" class="step-radio" />
          <input type="radio" name="step" id="step10" class="step-radio" />
          <div class="progress-track"><div class="progress-fill"></div></div>
          <p class="prompt" data-i18n="prompt"></p>

          <!-- مرحله 1 | راست = E1.jpg (عکس ۱) ، چپ = E13.jpg (عکس ۲) | ویژگی سنجیده‌شده: آرام و ساده  ⟷  شدید و احساسی -->
          <div class="step-block" data-page="1">
            <div class="step-count">1 / 10</div>
            <div class="pair">
              <div class="card-img" data-page="1" data-side="a">
                <input type="checkbox" id="z1a" class="zoom-chk" />
                <label for="z1a" class="img-open"
                  ><img
                    src="../img/E1.jpg"
                    alt="Truck on a quiet desert road in daylight"
                /></label>
                <label for="step2" class="pick-btn" data-i18n="pick"></label>
              </div>
              <div class="card-img" data-page="1" data-side="b">
                <input type="checkbox" id="z1b" class="zoom-chk" />
                <label for="z1b" class="img-open"
                  ><img
                    src="../img/E13.jpg"
                    alt="Truck facing the sunset on gravel"
                /></label>
                <label for="step2" class="pick-btn" data-i18n="pick"></label>
              </div>
            </div>
            <div class="controls">
              <label class="arrow invisible" data-i18n="prev"></label>
              <label
                for="step2"
                class="neither"
                data-page="1"
                data-a="0"
                data-b="0"
                data-i18n="neither"
              ></label>
              <label
                for="step2"
                class="both"
                data-page="1"
                data-a="1"
                data-b="1"
                data-i18n="both"
              ></label>
              <label for="step2" class="next" data-i18n="next"></label>
            </div>
          </div>
          <!-- مرحله 2 | راست = E16.jpg (عکس ۱) ، چپ = E14.jpg (عکس ۲) | ویژگی سنجیده‌شده: سفر و حرکت  ⟷  سکون و تنهایی -->
          <div class="step-block" data-page="2">
            <div class="step-count">2 / 10</div>
            <div class="pair">
              <div class="card-img" data-page="2" data-side="a">
                <input type="checkbox" id="z2a" class="zoom-chk" />
                <label for="z2a" class="img-open"
                  ><img
                    src="../img/E16.jpg"
                    alt="Truck on a curved road at sunset"
                /></label>
                <label for="step3" class="pick-btn" data-i18n="pick"></label>
              </div>
              <div class="card-img" data-page="2" data-side="b">
                <input type="checkbox" id="z2b" class="zoom-chk" />
                <label for="z2b" class="img-open"
                  ><img
                    src="../img/E14.jpg"
                    alt="Truck on a canyon cliff at dusk"
                /></label>
                <label for="step3" class="pick-btn" data-i18n="pick"></label>
              </div>
            </div>
            <div class="controls">
              <label for="step1" class="arrow" data-i18n="prev"></label>
              <label
                for="step3"
                class="neither"
                data-page="2"
                data-a="0"
                data-b="0"
                data-i18n="neither"
              ></label>
              <label
                for="step3"
                class="both"
                data-page="2"
                data-a="1"
                data-b="1"
                data-i18n="both"
              ></label>
              <label for="step3" class="next" data-i18n="next"></label>
            </div>
          </div>
          <!-- مرحله 3 | راست = E3.jpg (عکس ۱) ، چپ = E2.jpg (عکس ۲) | ویژگی سنجیده‌شده: رمز و ناشناخته  ⟷  نظم و کنترل -->
          <div class="step-block" data-page="3">
            <div class="step-count">3 / 10</div>
            <div class="pair">
              <div class="card-img" data-page="3" data-side="a">
                <input type="checkbox" id="z3a" class="zoom-chk" />
                <label for="z3a" class="img-open"
                  ><img
                    src="../img/E3.jpg"
                    alt="Covered truck on a showroom stage"
                /></label>
                <label for="step4" class="pick-btn" data-i18n="pick"></label>
              </div>
              <div class="card-img" data-page="3" data-side="b">
                <input type="checkbox" id="z3b" class="zoom-chk" />
                <label for="z3b" class="img-open"
                  ><img src="../img/E2.jpg" alt="Truck in a clean, lit garage"
                /></label>
                <label for="step4" class="pick-btn" data-i18n="pick"></label>
              </div>
            </div>
            <div class="controls">
              <label for="step2" class="arrow" data-i18n="prev"></label>
              <label
                for="step4"
                class="neither"
                data-page="3"
                data-a="0"
                data-b="0"
                data-i18n="neither"
              ></label>
              <label
                for="step4"
                class="both"
                data-page="3"
                data-a="1"
                data-b="1"
                data-i18n="both"
              ></label>
              <label for="step4" class="next" data-i18n="next"></label>
            </div>
          </div>
          <!-- مرحله 4 | راست = E21.jpg (عکس ۱) ، چپ = E19.jpg (عکس ۲) | ویژگی سنجیده‌شده: نوستالژی و خام  ⟷  مدرن و شهری -->
          <div class="step-block" data-page="4">
            <div class="step-count">4 / 10</div>
            <div class="pair">
              <div class="card-img" data-page="4" data-side="a">
                <input type="checkbox" id="z4a" class="zoom-chk" />
                <label for="z4a" class="img-open"
                  ><img src="../img/E21.jpg" alt="Truck at a night gas station"
                /></label>
                <label for="step5" class="pick-btn" data-i18n="pick"></label>
              </div>
              <div class="card-img" data-page="4" data-side="b">
                <input type="checkbox" id="z4b" class="zoom-chk" />
                <label for="z4b" class="img-open"
                  ><img src="../img/E19.jpg" alt="Truck front view at sunset"
                /></label>
                <label for="step5" class="pick-btn" data-i18n="pick"></label>
              </div>
            </div>
            <div class="controls">
              <label for="step3" class="arrow" data-i18n="prev"></label>
              <label
                for="step5"
                class="neither"
                data-page="4"
                data-a="0"
                data-b="0"
                data-i18n="neither"
              ></label>
              <label
                for="step5"
                class="both"
                data-page="4"
                data-a="1"
                data-b="1"
                data-i18n="both"
              ></label>
              <label for="step5" class="next" data-i18n="next"></label>
            </div>
          </div>
          <!-- مرحله 5 | راست = E6.jpg (عکس ۱) ، چپ = E9.jpg (عکس ۲) | ویژگی سنجیده‌شده: تند و پرخاشگر  ⟷  گرم و دوستانه -->
          <div class="step-block" data-page="5">
            <div class="step-count">5 / 10</div>
            <div class="pair">
              <div class="card-img" data-page="5" data-side="a">
                <input type="checkbox" id="z5a" class="zoom-chk" />
                <label for="z5a" class="img-open"
                  ><img src="../img/E6.jpg" alt="Work Haul Repeat poster"
                /></label>
                <label for="step6" class="pick-btn" data-i18n="pick"></label>
              </div>
              <div class="card-img" data-page="5" data-side="b">
                <input type="checkbox" id="z5b" class="zoom-chk" />
                <label for="z5b" class="img-open"
                  ><img src="../img/E9.jpg" alt="Sunset Hauler poster"
                /></label>
                <label for="step6" class="pick-btn" data-i18n="pick"></label>
              </div>
            </div>
            <div class="controls">
              <label for="step4" class="arrow" data-i18n="prev"></label>
              <label
                for="step6"
                class="neither"
                data-page="5"
                data-a="0"
                data-b="0"
                data-i18n="neither"
              ></label>
              <label
                for="step6"
                class="both"
                data-page="5"
                data-a="1"
                data-b="1"
                data-i18n="both"
              ></label>
              <label for="step6" class="next" data-i18n="next"></label>
            </div>
          </div>
          <!-- مرحله 6 | راست = E5.jpg (عکس ۱) ، چپ = E4.jpg (عکس ۲) | ویژگی سنجیده‌شده: وینتیج و قدیمی  ⟷  مدرن و جسور -->
          <div class="step-block" data-page="6">
            <div class="step-count">6 / 10</div>
            <div class="pair">
              <div class="card-img" data-page="6" data-side="a">
                <input type="checkbox" id="z6a" class="zoom-chk" />
                <label for="z6a" class="img-open"
                  ><img src="../img/E5.jpg" alt="Open Road vintage poster"
                /></label>
                <label for="step7" class="pick-btn" data-i18n="pick"></label>
              </div>
              <div class="card-img" data-page="6" data-side="b">
                <input type="checkbox" id="z6b" class="zoom-chk" />
                <label for="z6b" class="img-open"
                  ><img src="../img/E4.jpg" alt="Sunset Legend poster"
                /></label>
                <label for="step7" class="pick-btn" data-i18n="pick"></label>
              </div>
            </div>
            <div class="controls">
              <label for="step5" class="arrow" data-i18n="prev"></label>
              <label
                for="step7"
                class="neither"
                data-page="6"
                data-a="0"
                data-b="0"
                data-i18n="neither"
              ></label>
              <label
                for="step7"
                class="both"
                data-page="6"
                data-a="1"
                data-b="1"
                data-i18n="both"
              ></label>
              <label for="step7" class="next" data-i18n="next"></label>
            </div>
          </div>
          <!-- مرحله 7 | راست = E11.jpg (عکس ۱) ، چپ = E12.jpg (عکس ۲) | ویژگی سنجیده‌شده: قدرت و عملکرد  ⟷  داستان و معنا -->
          <div class="step-block" data-page="7">
            <div class="step-count">7 / 10</div>
            <div class="pair">
              <div class="card-img" data-page="7" data-side="a">
                <input type="checkbox" id="z7a" class="zoom-chk" />
                <label for="z7a" class="img-open"
                  ><img src="../img/E11.jpg" alt="V10 Power poster"
                /></label>
                <label for="step8" class="pick-btn" data-i18n="pick"></label>
              </div>
              <div class="card-img" data-page="7" data-side="b">
                <input type="checkbox" id="z7b" class="zoom-chk" />
                <label for="z7b" class="img-open"
                  ><img src="../img/E12.jpg" alt="Born Again night poster"
                /></label>
                <label for="step8" class="pick-btn" data-i18n="pick"></label>
              </div>
            </div>
            <div class="controls">
              <label for="step6" class="arrow" data-i18n="prev"></label>
              <label
                for="step8"
                class="neither"
                data-page="7"
                data-a="0"
                data-b="0"
                data-i18n="neither"
              ></label>
              <label
                for="step8"
                class="both"
                data-page="7"
                data-a="1"
                data-b="1"
                data-i18n="both"
              ></label>
              <label for="step8" class="next" data-i18n="next"></label>
            </div>
          </div>
          <!-- مرحله 8 | راست = E10.jpg (عکس ۱) ، چپ = E17.jpg (عکس ۲) | ویژگی سنجیده‌شده: پرجزئیات و غنی  ⟷  ساده و فضادار -->
          <div class="step-block" data-page="8">
            <div class="step-count">8 / 10</div>
            <div class="pair">
              <div class="card-img" data-page="8" data-side="a">
                <input type="checkbox" id="z8a" class="zoom-chk" />
                <label for="z8a" class="img-open"
                  ><img src="../img/E10.jpg" alt="American Steel Lives poster"
                /></label>
                <label for="step9" class="pick-btn" data-i18n="pick"></label>
              </div>
              <div class="card-img" data-page="8" data-side="b">
                <input type="checkbox" id="z8b" class="zoom-chk" />
                <label for="z8b" class="img-open"
                  ><img src="../img/E17.jpg" alt="Road Feels poster"
                /></label>
                <label for="step9" class="pick-btn" data-i18n="pick"></label>
              </div>
            </div>
            <div class="controls">
              <label for="step7" class="arrow" data-i18n="prev"></label>
              <label
                for="step9"
                class="neither"
                data-page="8"
                data-a="0"
                data-b="0"
                data-i18n="neither"
              ></label>
              <label
                for="step9"
                class="both"
                data-page="8"
                data-a="1"
                data-b="1"
                data-i18n="both"
              ></label>
              <label for="step9" class="next" data-i18n="next"></label>
            </div>
          </div>
          <!-- مرحله 9 | راست = E15.jpg (عکس ۱) ، چپ = E8.jpg (عکس ۲) | ویژگی سنجیده‌شده: سرعت  ⟷  استحکام و قدرت -->
          <div class="step-block" data-page="9">
            <div class="step-count">9 / 10</div>
            <div class="pair">
              <div class="card-img" data-page="9" data-side="a">
                <input type="checkbox" id="z9a" class="zoom-chk" />
                <label for="z9a" class="img-open"
                  ><img src="../img/E15.jpg" alt="Flash Road poster"
                /></label>
                <label for="step10" class="pick-btn" data-i18n="pick"></label>
              </div>
              <div class="card-img" data-page="9" data-side="b">
                <input type="checkbox" id="z9b" class="zoom-chk" />
                <label for="z9b" class="img-open"
                  ><img src="../img/E8.jpg" alt="Heavy Duty Spirit poster"
                /></label>
                <label for="step10" class="pick-btn" data-i18n="pick"></label>
              </div>
            </div>
            <div class="controls">
              <label for="step8" class="arrow" data-i18n="prev"></label>
              <label
                for="step10"
                class="neither"
                data-page="9"
                data-a="0"
                data-b="0"
                data-i18n="neither"
              ></label>
              <label
                for="step10"
                class="both"
                data-page="9"
                data-a="1"
                data-b="1"
                data-i18n="both"
              ></label>
              <label for="step10" class="next" data-i18n="next"></label>
            </div>
          </div>
          <!-- مرحله 10 | راست = E20.jpg (عکس ۱) ، چپ = E18.jpg (عکس ۲) | ویژگی سنجیده‌شده: عکس واقعی و نزدیک  ⟷  طرح گرافیکی و پیام -->
          <div class="step-block" data-page="10">
            <div class="step-count">10 / 10</div>
            <div class="pair">
              <div class="card-img" data-page="10" data-side="a">
                <input type="checkbox" id="z10a" class="zoom-chk" />
                <label for="z10a" class="img-open"
                  ><img
                    src="../img/E20.jpg"
                    alt="Close-up of a truck in motion"
                /></label>
                <button
                  type="button"
                  class="pick-btn"
                  data-i18n="pick"
                ></button>
              </div>
              <div class="card-img" data-page="10" data-side="b">
                <input type="checkbox" id="z10b" class="zoom-chk" />
                <label for="z10b" class="img-open"
                  ><img src="../img/E18.jpg" alt="Road Feels poster"
                /></label>
                <button
                  type="button"
                  class="pick-btn"
                  data-i18n="pick"
                ></button>
              </div>
            </div>
            <div class="controls">
              <label for="step9" class="arrow" data-i18n="prev"></label>
              <button id="finishBtn" data-i18n="finish"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ درباره ما ============ -->
      <section id="about">
        <div class="about-logos">
          <!-- لوگوی اول: ادیتوری | لوگوی دوم: شرکت مورد نظر (فعلاً همان لوگو) -->
          <div class="logo2">
            <img
              class="logo-img"
              src="/public/svg/adtory_logo-13.svg"
              alt="لوگو"
            />
          </div>
          <!-- <img class="logo-img" src="../svg/logo.svg" alt="لوگوی دوم" /> -->
        </div>
        <h2 data-i18n="aboutTitle"></h2>
        <p data-i18n="aboutBody"></p>
        <label for="viewHero" class="home-btn" data-i18n="backHome"></label>
      </section>

      <!-- ============ پنل ادمین (با ?admin=1 در آدرس باز می‌شود) ============ -->
      <section id="adminview">
        <h2 data-i18n="adminTitle"></h2>
        <p id="adminStatus" style="color: var(--gray); margin-top: 8px"></p>
        <div
          class="no-print"
          style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px"
        >
          <button class="home-btn" id="exportBtn">خروجی JSON</button>
          <button class="home-btn" id="clearBtn">
            پاک‌کردن پاسخ‌های این مرورگر
          </button>
